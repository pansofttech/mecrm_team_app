<div class="app-container">
  <div class="app-locked--container" *ngIf="!showAPILoader">
    <app-navigation-bar
      [title]="'Notifications'"
      [showRefresh]="false"
      (backClick)="onBackClickHandle()">
    </app-navigation-bar>

    <!-- TABS -->
    <div class="app-screen--stepper-new" *ngIf="!showEnableNotificationsButton">
      <div class="app-screen--stepper-container-new"
        [ngClass]="{'selected': activeTab === 'all'}"
        (click)="onTabChange('all')">
        <span class="notification-tab-label">
          All
          <span class="notification-tab-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </span>
      </div>
      <div class="app-screen--stepper-container-new"
        [ngClass]="{'selected': activeTab === 'unread'}"
        (click)="onTabChange('unread')">
        <span class="notification-tab-label">
          Unread
          <span class="notification-tab-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </span>
      </div>
      <div class="app-screen--stepper-container-new"
        [ngClass]="{'selected': activeTab === 'read'}"
        (click)="onTabChange('read')">
        Read
      </div>
    </div>

    <div class="notification-permission-prompt" *ngIf="showEnableNotificationsButton">
      <div class="notification-permission-text">
        Enable notifications to receive live updates and alerts.
      </div>
      <button class="k-button k-primary" type="button" (click)="requestNotificationPermission()">
        Enable Notifications
      </button>
    </div>
  </div>

  <ion-content scrollEvents="true" *ngIf="!showEnableNotificationsButton">
    <!-- EMPTY STATE -->
    <div *ngIf="filteredNotifications.length === 0" class="notification-empty-state">
      <img src="assets/content/images/noNotification.png" alt="No Notifications" class="notification-empty-img" />
      <p class="notification-empty-title">You're all caught up!</p>
      <p class="notification-empty-subtitle">We'll notify you when there's something new</p>
    </div>

    <!-- NOTIFICATION CARDS -->
    <div class="notification-list" *ngIf="filteredNotifications.length > 0">
      <div
        *ngFor="let a of filteredNotifications"
        class="notification-card-wrapper"
        [class.swiped]="swipedId === a.notificationId"
        (touchstart)="onTouchStart($event, a.notificationId)"
        (touchend)="onTouchEnd($event, a.notificationId)">

        <!-- SWIPE ACTION (tick) -->
        <div class="notification-swipe-action">
          <button class="notification-tick-btn" (click)="onMarkRead(a.notificationId)">
            <i class="fa fa-check"></i>
          </button>
        </div>

        <!-- CARD CONTENT -->
        <div class="notification-card-item" (click)="onNotificationClick(a.notificationId)">
          <div class="notification-card-icon-wrapper">
            <div class="notification-card-icon-circle"
              [ngStyle]="{ backgroundColor: a.iconColor, color: a.iconInnerColor }">
              <i class="fa" [ngClass]="'fa-' + a.notificationIcon"></i>
            </div>
          </div>

          <div class="notification-card-content">
            <div class="notification-action-required" *ngIf="!a.actioned">Action Required</div>
            <div class="notification-card-title">{{ a.notificationTitle }}</div>
            <div class="notification-card-body">{{ a.notificationBody }}</div>
          </div>

          <div class="notification-card-right">
            <i class="fas fa-chevron-right notification-chevron"></i>
          </div>

        </div>

      </div>
    </div>
  </ion-content>

  <div class="app-screen--loader" *ngIf="showAPILoader">
    <kendo-loader
      type="converging-spinner"
      themeColor="info"
      size="medium"></kendo-loader>
    <div>Loading Notifications...</div>
  </div>
</div>
