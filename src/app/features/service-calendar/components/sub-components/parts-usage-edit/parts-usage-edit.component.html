<div class="app-screen--content">

      <kendo-formfield>
        <div class="app-kendo--content">
          <kendo-label class="app-kendo--label app-kendo--label-horizontal" [for]="supplierName">
            Supplier Name
          </kendo-label>
          <kendo-textbox
            class="app-kendo--dropdownlist"
            formControlName="supplierName"
            #supplierName>
          </kendo-textbox>
        </div>
        <kendo-formerror class="app-kendo--error-msg">
          Supplier name is required
        </kendo-formerror>
      </kendo-formfield>

        </div>
        <kendo-formerror class="app-kendo--error-msg">
          Part No. is required
        </kendo-formerror>
      </kendo-formfield>

      <kendo-formfield>
        <div class="app-kendo--content">
          <kendo-label
            class="app-kendo--label"
            [for]="description">
            Description
          </kendo-label>
          <kendo-textarea
            class="app-kendo--textarea"
            placeholder="Type  your message here.."
            formControlName="description"
            #description
            [rows]="6"
            resizable="vertical"></kendo-textarea>
        </div>
        <kendo-formerror class="app-kendo--error-msg">
            Description is required
        </kendo-formerror>
      </kendo-formfield>   

      <kendo-formfield>
        <div class="app-kendo--content">
          <kendo-label class="app-kendo--label app-kendo--label-horizontal" [for]="qty">
            Req Qty
          </kendo-label>
          <kendo-textbox
            class="app-kendo--dropdownlist"
            formControlName="qty"
            #qty>
          </kendo-textbox>
        </div>
        <kendo-formerror class="app-kendo--error-msg">
          Req Qty is required
        </kendo-formerror>
      </kendo-formfield>

      <kendo-formfield>
        <div class="app-kendo--content">
            <kendo-label class="app-kendo--label app-kendo--label-horizontal" [for]="usedQty">
            Used Qty
            </kendo-label>

            <kendo-numerictextbox
                class="app-kendo--dropdownlist"
                formControlName="usedQty"
                #usedQty
                [format]="'n0'"       
                [decimals]="0"        
                [min]="0"            
                [spinners]="false"
                placeholder="Enter used quantity">
            </kendo-numerictextbox>
        </div>

        <kendo-formerror class="app-kendo--error-msg">
            Used Qty is required
        </kendo-formerror>
      </kendo-formfield>

        <div class="app-kendo--content">

      <kendo-formfield>
        <div class="app-kendo--content">
          <kendo-label
            class="app-kendo--label"
            [for]="remarks">
            Remarks
          </kendo-label>
          <kendo-textarea
            class="app-kendo--textarea"
            placeholder="Type  your message here.."
            formControlName="remarks"
            #remarks
            [rows]="6"
            resizable="vertical"></kendo-textarea>
        </div>
        <kendo-formerror class="app-kendo--error-msg">
            Remarks is required
        </kendo-formerror>
      </kendo-formfield>    
    </div>

    <div class="app-screen--footer">
      <button
        kendoButton
        class="app-save--button"
        (click)="submit()">
        Submit
      </button>
      <button
        kendobutton
        class="app-cancel--button"
        (click)="onBackClickHandle()">
        Cancel
      </button>
    </div>
</div>

<div class="app-screen--loader" *ngIf="showAPILoader">
  <kendo-loader
    type="converging-spinner"
    themeColor="info"
    size="medium"></kendo-loader>
  <div>Loading parts usage details....</div>
</div>
