<app-navigation-bar
  [title]="'Generate CSR'"
  [subtitle]="'SRID: ' + this.serviceCalendarService.selectedSRID.toString()"
  [showRefresh]="true"
  (backClick)="onBackClickHandle()"
  (refreshClick)="onRefresh()">
</app-navigation-bar>

<div *ngIf="!showAPILoader" class="csr-pdf-screen">
    <kendo-pdfviewer 
     style="height: 30rem;margin: 0.25rem;"
     [arrayBuffer]="arrayBuffer"
     [zoom]="1"
     [tools]="tools"> 
    </kendo-pdfviewer>

    <div class="content-wrapper">
      <div class="app-secondary-header">
          <div class="app-secondary-header-left">
            <i class="fa-solid fa-user-gear app-secondary-header-icon"></i>
            <div class="app-secondary-header-name">Engineer Signature</div>
          </div>
      </div>
      <div class="signature-wrapper">
        <kendo-signature
            #engineerSignature
            [(value)]="engineerSignatureValue"
            [color]="color"
            [backgroundColor]="backgroundColor"
            [strokeWidth]="strokeWidth"
            [smooth]="true"
            [maximizable]="false"
            [hideLine]="true"
        ></kendo-signature>
      </div>
      <div class="clear-button">
        <button 
            kendoButton
            (click)="clearEngineerSignature()">
            Clear
        </button>
      </div>
    </div>   

    <div class="content-wrapper">
      <div class="app-secondary-header">
          <div class="app-secondary-header-left">
            <i class="fa-solid fa-user app-secondary-header-icon"></i>
            <div class="app-secondary-header-name">Customer Signature</div>
          </div>
      </div>
      <div class="signature-wrapper">
        <kendo-signature
            #customerSignature
            *ngIf="!showUpload"
            [(value)]="customerSignatureValue"
            [color]="color"
            [backgroundColor]="backgroundColor"
            [strokeWidth]="strokeWidth"
            [smooth]="true"
            [maximizable]="false"
            [hideLine]="true"
        ></kendo-signature>
        <ng-container *ngIf="showUpload">
            <div *ngIf="!imageURL" class="placeholder">
              <kendo-svgicon [icon]="imageIcon" size="xlarge"></kendo-svgicon>
              <span>Please, browse an image to preview here.</span>
            </div>
            <img
              *ngIf="imageURL"
              [src]="imageURL"
              title="Uploaded signature"
              draggable="false"
            />
        </ng-container>
      </div>
      <div class="clear-button">
        <button 
            kendoButton
            (click)="clearCustomerSignature()">
            Clear
        </button>
      </div>
    </div>   
</div>

  <div class="app-screen--footer" *ngIf="!showAPILoader">
    <button kendoButton
            class="app-save--button"
            (click)="onSave()">
      <i class="fa-solid fa-floppy-disk"></i>
      Save & Attach CSR
    </button>
    <button kendobutton
            class="app-cancel--button"
            (click)="onBackClickHandle()">
        Cancel
     </button>
  </div>

<div class="app-screen--loader" *ngIf="showAPILoader">
    <kendo-loader
      type="converging-spinner"
      themeColor="info"
      size="medium"></kendo-loader>
    <div>Generating CSR....</div>
</div>
