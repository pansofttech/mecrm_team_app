<div class="app-locked--container" *ngIf="!showAPILoader">
  <div class="app-secondary-header">
    <div class="app-secondary-header-left">
      <img src="assets/content/images/call-continue.svg" 
       style="width: 18px; height: 18px;filter: brightness(0) invert(1);"/>
      <div class="app-secondary-header-name">Call continue</div>
    </div>
    <button class="app-secondary-header--btn"
      (click)="onBackClickHandle()">
      <i class="fa-solid fa-chevron-left app-secondary-header--btn-icon"></i>
      <span>Back</span>
    </button>
  </div>
</div>

<div class="app-scrollable--container" *ngIf="!showAPILoader">
  <div class="app-screen--content">
    <div class="app-screen--footer">
      <button
        kendoButton
        class="app-save--button"
        (click)="submit()">
        Submit
      </button>
      <button
        kendobutton
        class="app-cancel--button"
        (click)="onBackClickHandle()">
        Cancel
      </button>
    </div>
  </div>
</div>

<div class="app-screen--loader" *ngIf="showAPILoader">
  <kendo-loader
    type="converging-spinner"
    themeColor="info"
    size="medium"></kendo-loader>
  <div>{{ loaderMessage }}</div>
</div>
