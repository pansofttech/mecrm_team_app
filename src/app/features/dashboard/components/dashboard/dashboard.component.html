<div class="landing-page-main">
  <div class="dashboard-header">
    <div class="dashboard-header-top">
      <button kendoButton fillMode="flat" class="dashboard-menu-btn"
       (click)="drawer.toggle()">
        <!-- <kendo-svg-icon [icon]="menuIcon"></kendo-svg-icon> -->
        <i class="fa-solid fa-bars app-icon-light"></i>
      </button>
      
      <div class="dashboard-logo-section">
        <img src="assets/content/images/dashboard-images/dashboard--ecrm-logo.png" alt="" class="dashboard-ecrm-logo" />
        <span>ECRM</span>
      </div>
      
      <kendo-badge-container class="dashboard-badge-container">
        <button kendoButton fillMode="flat" class="dashboard-notification-btn" (click)="onNotificationClick()">
          <section class="notification-icon">
            <i class="fa-solid fa-bell"></i>
            <span *ngIf="unseenCount > 0" class="badge bounce-once">
              {{ unseenCount }}
            </span>
          </section>
        </button>
      </kendo-badge-container>
    </div>
    
    <div class="dashboard-header-bottom">
      <div class="dashboard-welcome-section">
        <div class="dashboard-welcome">Hi,</div>
        <div class="dashboard-name">{{ getEmployeeName() }}</div>
      </div>
      <div class="dashboard-initials-bubble">{{ getEmployeeInitials() }}</div>
    </div>
  </div>

  <app-dashboard-cards [cards]="filteredQuickCards"></app-dashboard-cards>
</div>

<kendo-drawer-container class="dashboard--menu-container">
  <kendo-drawer
    #drawer
    [mode]="'overlay'"
    [expanded]="false"
    class="fullscreen-drawer"
  >
  <ng-template kendoDrawerHeaderTemplate>
    <div class="drawer-header-gradient">
      <div class="drawer-header-content">
        <div class="drawer-user-initials">{{ getEmployeeInitials() }}</div>
        <div class="drawer-user-info">
          <div class="drawer-user-name">{{ getEmployeeName() }}</div>
          <div class="drawer-user-role">CRM Administrator</div>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template kendoDrawerFooterTemplate>
   
    <div class="drawer-menu-section">
      <div class="drawer-menu-title">MENU</div>
      
      <!-- Dashboard -->
      <div class="drawer-menu-item" 
          [class.active]="selectedMenu === 'Dashboard'"
          (click)="selectMenu('Dashboard')">
        <i class="fas fa-home drawer-menu-icon"></i>
        <span>Dashboard</span>
      </div>
      
      <!-- Module Items -->
      <div *ngFor="let module of uniqueModules">
        <div class="drawer-menu-item-collapse"
            [class.expanded]="expandedModule === module">
          <button class="drawer-menu-item-header"
                  [class.active]="selectedMenu === module"
                  (click)="toggleModule(module)">
            <fa-icon
                class="drawer-menu-icon"
                [icon]="['fas', getModuleIcon(module)]">
            </fa-icon>
            <span class="drawer-menu-text">{{ module }}</span>
            <i class="fas fa-chevron-down drawer-chevron"></i>
          </button>

          <div class="drawer-submenu" *ngIf="expandedModule === module">
            <button class="drawer-submenu-item"
                    *ngFor="let card of getCardsByModule(module)"
                    [class.active]="selectedMenu === card.text"
                    (click)="handleMenuCardClick(card)">
              <fa-icon
                class="drawer-submenu-icon"
                [icon]="['fas', getIconName(card.image)]">
              </fa-icon>
              <span class="drawer-submenu-text">{{ card.text }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="drawer-footer-section">
      <div class="drawer-footer-item sign-out" (click)="onSignOut()">
        <i class="fas fa-sign-out-alt drawer-menu-icon"></i>
        <span>Sign Out</span>
      </div>
    </div>
  </ng-template>
  </kendo-drawer>
</kendo-drawer-container>
