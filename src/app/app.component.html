<router-outlet></router-outlet>

<!-- Speech recognition listening overlay -->
<div class="mic-overlay" *ngIf="isSpeechListening$ | async">
  <div class="mic-overlay--backdrop"></div>
  <div class="mic-overlay--card">
    <div class="mic-overlay--pulse">
      <i class="fas fa-microphone mic-overlay--icon"></i>
    </div>
    <p class="mic-overlay--label">Listening...</p>
    <button class="mic-overlay--stop-btn" (click)="stopListening()">Stop Listening</button>
  </div>
</div>
